    <!-- 카톡/인스타 등에 링크 공유 시 미리보기 카드에 쓰이는 정보.
         og:image는 지금 512x512 앱 아이콘을 임시로 쓰고 있음 — 실제 배너
         이미지(1200x630)가 생기면 이 값만 바꿔주면 됨. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LessGo" />

    <meta property="og:image" content="https://lessgo-mu.vercel.app/icon-512.png" />

    <meta name="twitter:description" content="친구들과 함께 스마트폰 사용 시간을 줄이는 챌린지 앱. 매일 인증하고, 목표를 달성해요." />
    <meta name="twitter:image" content="https://lessgo-mu.vercel.app/icon-512.png" />

    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>

    <!-- A stale service worker (installed before some later deploy) can
         serve an old cached index.html whose script/style tags point at
         content-hashed filenames that no longer exist on the server —
         those requests 404, the bundle never runs, and the page is
         permanently blank with no way for the app's own JS to recover
         (it never loaded). This has nothing to do with in-app routing —
         it fires before React ever mounts — so it has to live here, not
         in src/. Unregistering the stuck worker and reloading once (the
         sessionStorage guard stops a retry loop if the reload fails for
         some unrelated reason) self-heals instead of leaving a dead tab. -->
    <script>
      (function () {
        var KEY = 'lessgo:sw-recovery'
        window.addEventListener(
          'error',
          function (e) {
            var src = e && e.target && e.target.src
            if (!src || src.indexOf('/assets/') === -1 || sessionStorage.getItem(KEY)) return
            sessionStorage.setItem(KEY, '1')
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                })
                .finally(function () { location.reload() })
            } else {
              location.reload()
            }
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
