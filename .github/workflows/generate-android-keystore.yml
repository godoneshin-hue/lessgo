name: Generate Android signing keystore

# Run this exactly once. It creates a new release keystore and hands it back
# to you as a downloadable file — save it somewhere safe (outside GitHub too)
# and add its base64 form as the ANDROID_KEYSTORE_BASE64 secret. Losing this
# keystore means you can never publish an update to the same Play Store
# listing again, so treat it like a password you can't reset.
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore lessgo-release.keystore \
            -alias lessgo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_GEN_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_GEN_PASSWORD }}" \
            -dname "CN=LessGo, OU=LessGo, O=LessGo, L=Seoul, ST=Seoul, C=KR"
          base64 -w 0 lessgo-release.keystore > lessgo-release.keystore.base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lessgo-release-keystore
          path: |
            lessgo-release.keystore
            lessgo-release.keystore.base64.txt
          retention-days: 7
