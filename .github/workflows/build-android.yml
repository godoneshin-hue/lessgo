name: Build Android app

# Builds a signed release APK (for direct install/trial, e.g. sideloading for
# a crowdfunding demo) and AAB (for eventual Play Store submission). Run this
# manually whenever the native shell changes (icons, permissions, signing) —
# it does NOT need to run on every web content push, since the app loads the
# live site at runtime (see capacitor.config.ts's server.url).
#
# Requires these secrets to already exist (Settings > Secrets and variables >
# Actions), from running generate-android-keystore.yml once and saving its
# output:
#   ANDROID_KEYSTORE_BASE64   - the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD - the password used for both storepass and keypass
#   ANDROID_KEY_ALIAS         - 'lessgo' if using the default from that workflow
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        working-directory: android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (for later Play Store submission)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lessgo-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
